plugins { id 'java' }

repositories { mavenCentral() }

dependencies {
    // BOM согласует версии всех модулей JUnit между собой — не будешь гадать
    testImplementation platform('org.junit:junit-bom:6.1.3')

    testImplementation 'org.junit.jupiter:junit-jupiter'          // api + params + engine
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher' // <-- вот этого не хватало

    testImplementation 'com.codeborne:selenide:7.19.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.20'
}

test {
    useJUnitPlatform()
}